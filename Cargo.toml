[workspace]
resolver = "2"
members = ["eigen-core", "eigen-transport", "eigen-relay", "eigen-tui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize", "rand_core"] }
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
blake2 = { version = "=0.10.6", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
sha1 = { version = "=0.10.7", default-features = false }
hkdf = { version = "=0.12.4", default-features = false }
hmac = { version = "=0.12.1", default-features = false }
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
zeroize = { version = "=1.9.0", features = ["zeroize_derive"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
tokio = { version = "=1.53.2", default-features = false, features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.28.1", default-features = false, features = ["events"] }
libc = "=0.2.190"
snow = { version = "=0.10.0", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom", "std"] }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.eigen-core]
opt-level = 2
