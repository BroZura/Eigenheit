# cargo-deny: licenses, advisories, bans, sources.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# `paste` is an unmaintained compile-time proc-macro reached via ratatui; it is not
# a vulnerability and never runs in the shipped binary. Revisit on the next ratatui bump.
ignore = [{ id = "RUSTSEC-2024-0436", reason = "unmaintained build-time macro via ratatui, no known vulnerability" }]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "BSD-2-Clause", "Unicode-3.0", "Zlib", "ISC", "AGPL-3.0-or-later", "MPL-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# No telemetry, no HTTP clients, no update checkers, no logging frameworks in the graph.
deny = [
  { name = "reqwest" }, { name = "hyper" }, { name = "ureq" }, { name = "curl" },
  { name = "sentry" }, { name = "opentelemetry" }, { name = "log4rs" }, { name = "env_logger" },
  { name = "tracing-subscriber" }, { name = "openssl" }, { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
