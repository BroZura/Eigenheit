# cargo-deny configuration: licenses, security advisories, banned crates and crate sources.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# `paste` is an unmaintained procedural macro that ratatui uses at compile time.
# It has no known vulnerability and is not part of the released binary.
# Review this exception when ratatui is updated.
ignore = [{ id = "RUSTSEC-2024-0436", reason = "Unmaintained compile-time macro used by ratatui. No known vulnerability." }]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "BSD-2-Clause", "Unicode-3.0", "Zlib", "ISC", "AGPL-3.0-or-later", "MPL-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Crates for telemetry, HTTP clients, update checks, logging and OpenSSL are not
# allowed in the dependency graph.
deny = [
  { name = "reqwest" }, { name = "hyper" }, { name = "ureq" }, { name = "curl" },
  { name = "sentry" }, { name = "opentelemetry" }, { name = "log4rs" }, { name = "env_logger" },
  { name = "tracing-subscriber" }, { name = "openssl" }, { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
